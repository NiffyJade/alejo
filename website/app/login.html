<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Alejo staff dashboard</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5fa">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
</head>
<body data-page="login">
<a class="skip" href="#main">Skip to content</a>
<main class="login-wrap" id="main">
  <section class="login" aria-labelledby="h-login">
    <a class="brand" href="/app/index.html" aria-label="Alejo, dashboard"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17a9 9 0 0 1 18 0z" fill="#111"/><rect x="2" y="18.5" width="20" height="2.5" rx="1" fill="#111"/><circle cx="12" cy="6.2" r="2" fill="#1a4be0"/></svg><span class="brand-t"><b translate="no">Alejo</b></span></a>
    <h1 id="h-login">Sign in</h1>
    <p class="sub">For your hotel's staff. The demo needs no sign-in.</p>
    <form id="loginForm" class="login-form" novalidate>
      <div class="f"><label for="em">Email</label><input id="em" name="email" type="email" inputmode="email" autocomplete="username" spellcheck="false" required></div>
      <div class="f"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
      <p class="login-err" id="loginErr" role="alert"></p>
      <button class="btn" id="loginBtn" type="submit">Sign in</button>
    </form>
    <a class="back-link" href="/app/index.html">Back to the demo</a>
  </section>
</main>
<script src="/app/live.js"></script>
<script>
(() => {
  const err = document.getElementById('loginErr');
  if (new URLSearchParams(location.search).get('expired')) err.textContent = 'Your session ended. Please sign in again.';
  if (window.Alejo && window.Alejo.signedIn()) location.replace('/app/index.html');
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('em').value.trim(), password = document.getElementById('pw').value;
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    try { await window.Alejo.signIn(email, password); location.href = '/app/index.html'; }
    catch (x) { err.textContent = /invalid login/i.test(x.message) ? 'That email and password do not match.' : x.message; btn.disabled = false; btn.textContent = 'Sign in'; }
  });
})();
</script>
</body>
</html>
